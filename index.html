<!doctype html>
<html lang="de">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Modell-Quest Gesundheitsmodelle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: Spielkonsole im Dunkeln – oben die Anzeige (Herzen, Kombo, Münzen), darunter Weltkarte bzw. eine Frage-Karte nach der anderen */
:root{
  --night:#0f1330; --panel:#1b2150; --panel2:#262d6b; --edge:#3a4390; --txt:#eef0ff; --dim:#a9afe0;
  --cyan:#41e3ff; --heart:#ff4f6d; --coin:#ffd23f; --lime:#7dff8a; --violet:#b48cff;
  --f-pixel:"Press Start 2P","Courier New",monospace;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--txt);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(circle at 20% 10%,rgba(65,227,255,.10),transparent 40%),radial-gradient(circle at 85% 80%,rgba(180,140,255,.12),transparent 45%),
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:auto,auto,24px 24px,24px 24px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:4px solid var(--edge)}
.hud .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-pixel);font-size:.72rem;color:var(--cyan);flex:1;min-width:0;letter-spacing:.04em;text-shadow:0 0 8px rgba(65,227,255,.6)}
.coins{font-family:var(--f-pixel);font-size:.72rem;color:var(--coin);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.coin{width:14px;height:14px;border-radius:50%;background:var(--coin);box-shadow:inset -3px -3px 0 #c99a10}
.iconbtn{font:inherit;background:var(--panel2);color:var(--txt);border:2px solid var(--edge);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.85rem;min-height:36px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.stack{display:flex;flex-direction:column;gap:16px}
.px{font-family:var(--f-pixel);line-height:1.5}
h1{font-family:var(--f-pixel);font-size:clamp(1.05rem,4.6vw,1.6rem);line-height:1.5;margin:0;color:var(--txt);text-shadow:3px 3px 0 var(--heart);text-wrap:balance}
h2{font-family:var(--f-pixel);font-size:clamp(.85rem,3.6vw,1.05rem);line-height:1.6;margin:0;text-wrap:balance}
p{margin:0}
.lead{color:var(--dim);max-width:62ch}
.box{background:var(--panel);border:4px solid var(--edge);border-radius:4px;padding:16px;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
.tip{background:rgba(255,210,63,.1);border:2px dashed var(--coin);border-radius:4px;padding:12px 14px;font-size:.95rem}
.tip b{color:var(--coin)}
/* Weltkarte */
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.world{position:relative;font:inherit;color:var(--txt);text-align:left;background:var(--panel);border:4px solid var(--edge);border-radius:4px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:132px;box-shadow:6px 6px 0 rgba(0,0,0,.35);transition:transform .12s}
.world:not(:disabled):hover{transform:translate(-2px,-2px);border-color:var(--cyan)}
.world:disabled{cursor:not-allowed;filter:grayscale(.8);opacity:.5}
.world .nr{font-family:var(--f-pixel);font-size:.62rem;color:var(--cyan)}
.world .nm{font-weight:700;font-size:1.05rem;line-height:1.25}
.world .sb{font-size:.82rem;color:var(--dim)}
.world .st{margin-top:auto;display:flex;gap:4px;align-items:center;font-size:.8rem;color:var(--dim)}
.world.done{border-color:var(--lime)}
.world.next{border-color:var(--cyan);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px rgba(65,227,255,.55),6px 6px 0 rgba(0,0,0,.35)}}
.world.boss .nr{color:var(--heart)}
.heart{width:22px;height:20px;display:inline-block;flex:none}
.hearts{display:flex;gap:4px}
.xp{height:14px;background:var(--night);border:3px solid var(--edge);border-radius:2px;overflow:hidden}
.xp span{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--lime) 0 10px,#5ad86a 10px 20px);transition:width .4s}
.rankline{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--dim);flex-wrap:wrap}
.rankline b{color:var(--coin)}
/* Spielfeld */
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.combo{font-family:var(--f-pixel);font-size:.62rem;color:var(--violet);padding:6px 8px;border:2px solid var(--violet);border-radius:4px}
.combo.hot{color:var(--night);background:var(--coin);border-color:var(--coin);animation:shake .35s}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.label{font-family:var(--f-pixel);font-size:.6rem;color:var(--cyan);letter-spacing:.05em}
.prompt{font-size:1.25rem;font-weight:700;line-height:1.35}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{font:inherit;font-weight:700;color:var(--txt);background:var(--panel2);border:3px solid var(--edge);border-radius:4px;padding:12px 14px;cursor:pointer;text-align:left;min-height:54px;box-shadow:4px 4px 0 rgba(0,0,0,.4);transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(0,0,0,.4)}
.opt:disabled{cursor:default}
.opt.right{background:#1f5a3a;border-color:var(--lime)}
.opt.wrong{background:#5a1f2e;border-color:var(--heart)}
.opt.picked{border-color:var(--cyan);background:#20407a}
.feedback{border-radius:4px;padding:12px 14px;font-weight:700}
.feedback.good{background:rgba(125,255,138,.14);border:2px solid var(--lime);color:var(--lime)}
.feedback.bad{background:rgba(255,79,109,.14);border:2px solid var(--heart);color:#ffb3c0}
.feedback .why{display:block;font-weight:400;color:var(--txt);margin-top:4px}
.btn{font-family:var(--f-pixel);font-size:.72rem;line-height:1.4;border:0;border-radius:4px;padding:14px 18px;cursor:pointer;min-height:50px;background:var(--cyan);color:var(--night);box-shadow:4px 4px 0 #1a7f93}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #1a7f93}
.btn.red{background:var(--heart);box-shadow:4px 4px 0 #a32740;color:#fff}
.btn.ghost{background:transparent;color:var(--txt);border:3px solid var(--edge);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.float{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-family:var(--f-pixel);font-size:1.4rem;color:var(--coin);text-shadow:3px 3px 0 #000;pointer-events:none;z-index:20;animation:up 1s ease-out forwards}
.float.minus{color:var(--heart)}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
.bar{height:10px;background:var(--night);border:2px solid var(--edge);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--cyan);transition:width .3s}
textarea,select{font:inherit;color:var(--txt);background:var(--night);border:3px solid var(--edge);border-radius:4px;padding:8px 10px;width:100%}
textarea{min-height:100px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:24px;height:24px;margin-top:2px;accent-color:var(--lime);flex:none}
.slots{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.slot{border:3px dashed var(--edge);border-radius:4px;padding:10px 12px;min-height:50px;display:flex;align-items:center;gap:12px}
.slot::before{counter-increment:s;content:counter(s);font-family:var(--f-pixel);font-size:.75rem;color:var(--coin)}
.slot.filled{border-style:solid;border-color:var(--cyan)}
.slot.ok{border-color:var(--lime)}.slot.no{border-color:var(--heart)}
.merke{line-height:2.1}
.merke ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:10px}
.gap{display:inline-block;width:auto;min-width:9.5em;max-width:100%;padding:3px 6px;font-size:.95rem}
.gap.ok{border-color:var(--lime);background:#173b26}.gap.bad{border-color:var(--heart);background:#3e1722}
.gapsol{font-size:.85rem;color:var(--lime);font-weight:700;margin-left:4px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bank span{background:var(--panel2);border:2px solid var(--edge);border-radius:4px;padding:2px 8px;font-size:.88rem}
.bank span.used{text-decoration:line-through;opacity:.4}
.win{text-align:center;align-items:center}
.bigstars{display:flex;gap:10px;justify-content:center}
.bigstars svg{width:56px;height:56px;animation:pop .5s backwards}
.bigstars svg:nth-child(2){animation-delay:.25s}.bigstars svg:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.score-big{font-family:var(--f-pixel);font-size:2rem;color:var(--coin);text-shadow:4px 4px 0 #000;font-variant-numeric:tabular-nums}
table.hs{border-collapse:collapse;margin:0 auto;font-size:.95rem}
table.hs td{padding:6px 10px;border-bottom:2px solid var(--edge);text-align:left}
table.hs td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--coin)}
.foot{color:var(--dim);font-size:.8rem;text-align:center}
.kihinweis{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px;color:var(--dim);font-size:.75rem;text-align:center}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
@media (max-width:520px){.map{grid-template-columns:1fr}.opts.two{grid-template-columns:1fr}.world{min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="hud"><div class="in">
  <div class="logo">MODELL-QUEST</div>
  <div class="coins" title="Punkte"><span class="coin" aria-hidden="true"></span><span id="coins">0</span></div>
  <button class="iconbtn" id="snd" type="button" aria-pressed="false">Ton: aus</button>
</div></header>
</head><body>
<main class="wrap" id="app"></main>
<footer class="kihinweis">Dieses Material wurde mit Unterstützung von KI (Claude) erstellt und von HEU geprüft und angepasst.</footer>

<script>
(function(){
const KEY="modellquest-v1";
const BASE=10, RETRY=5;
const LEVELS=[
{ id:"globus", nr:1, title:"Globus-Check", sub:"Aufgabe 1 · Was zeigt ein Globus?",
  sheet:"Lies den Fachtext noch <b>nicht</b>! Entscheide bei jeder Karte: Zeigt ein Globus das – oder nicht? Danach schreibst du <b>je drei Beispiele</b> in die Tabelle zu Aufgabe 1.",
  tasks:[{type:"binary", opts:["✓ zeigt er","✗ zeigt er nicht"], items:[
    ["die Form der Erde (Kugel)",0,"Der Globus ist rund wie die Erde."],
    ["die Lage der Kontinente und Meere",0,"Kontinente und Ozeane sind an der richtigen Stelle eingezeichnet."],
    ["die Lage der Länder zueinander",0,"Man sieht, welche Länder nebeneinander liegen."],
    ["die Drehung um die schräge Erdachse",0,"Ein Globus lässt sich um seine schräge Achse drehen – wie die Erde."],
    ["die echte Größe der Erde",1,"Der Globus ist stark verkleinert."],
    ["das aktuelle Wetter und die Wolken",1,"Wetter verändert sich ständig – das zeigt ein Globus nicht."],
    ["wo gerade Tag und wo Nacht ist",1,"Tag und Nacht, auch Jahreszeiten, sieht man auf einem Globus nicht."],
    ["Straßen, Häuser und Menschen",1,"Dafür ist der Globus viel zu stark vereinfacht."],
    ["die echte Höhe der Gebirge",1,"Gebirge sind höchstens angedeutet, nicht in echter Höhe."],
    ["Veränderungen, z. B. neue Ländergrenzen",1,"Ein Globus zeigt den Stand, als er hergestellt wurde."]
  ]}]},
{ id:"vermutung", nr:2, title:"Deine Vermutung", sub:"Aufgabe 2 · Was ist ein Modell?",
  sheet:"Schreibe zuerst mit deinem Partner oder deiner Partnerin eure Vermutung (Hypothese) auf das Arbeitsblatt zu Aufgabe 2b. Den Text liest du immer noch <b>nicht</b>.",
  tasks:[
    {type:"note", label:"Unsere Vermutung (Pflichtfeld – bleibt nur auf deinem Gerät):", ph:"Ein Modell ist … Ein Modell kann …, aber es kann nicht …"},
    {type:"binary", stem:"Was passt zu einem Modell?", opts:["stimmt","stimmt nicht"], items:[
      ["Ein Modell ist eine verkleinerte oder vereinfachte Nachbildung von etwas Echtem.",0,"Genau – wie der Globus für die Erde."],
      ["Ein Modell ist genau so wie die Wirklichkeit.",1,"Ein Modell ist nie die Wirklichkeit selbst."],
      ["Ein Modell kann das Wichtigste zeigen.",0,"Es lässt Unwichtiges weg und zeigt das Wichtige."],
      ["Ein Modell kann alles zeigen, was es in der Wirklichkeit gibt.",1,"Beim Globus fehlen z. B. Wetter, Straßen und die echte Größe."],
      ["Ein Modell hilft, etwas verständlich zu machen.",0,"Dafür benutzt man Modelle im Unterricht."],

    ]},
    {type:"self", stem:"Vergleiche mit eurer Vermutung. Das hatten wir schon:", items:[
      "Ein Modell ist eine Nachbildung von etwas Echtem.",
      "Ein Modell ist vereinfacht und zeigt das Wichtigste.",
      "Ein Modell kann nicht alles zeigen – es ist nicht die Wirklichkeit selbst."
    ]}
  ],
  solution:"<b>Mögliche Vermutung:</b> „Ein Modell ist eine verkleinerte bzw. vereinfachte Nachbildung von etwas Echtem. Es kann das Wichtigste zeigen und verständlich machen, aber es kann nicht alles zeigen – es ist nicht die Wirklichkeit selbst.“"},
{ id:"lesen", nr:3, title:"Lese-Station", sub:"Schritt 2 · Fachtext lesen", read:true,
  sheet:"Lies jetzt den Fachtext auf <b>Seite 2 und 3</b> deines Arbeitsblatts <b>zweimal</b> und unterstreiche wichtige Punkte. Unbekannte Wörter stehen in den Worterklärungen. (ca. 20 Min.)"},
{ id:"text", nr:4, title:"Text-Detektiv", sub:"Aufgabe 3 · Vermutung prüfen (Z. 4–14)",
  sheet:"Prüfe die Aussagen mit dem Text (Z. 4–14). Trage danach in die Tabelle zu Aufgabe 3 ein: <b>Was stimmt</b> an eurer Vermutung, und <b>was ergänzt oder korrigierst du</b>?",
  tasks:[{type:"binary", opts:["richtig","falsch"], items:[

    ["Modelle sind grafische oder symbolische Darstellungen bestimmter Phänomene.",0,"Z. 5–6."],
    ["Modelle zeigen immer nur den Aufbau, also etwas Statisches.",1,"Z. 6–8: Modelle können statisch (Aufbau) oder dynamisch (Abläufe) sein."],
    ["Ein Modell ist ein Abbild der Wirklichkeit, aber nicht die Wirklichkeit selbst.",0,"Z. 8–9: „ohne einen Anspruch auf Wirklichkeit zu besitzen“."],
    ["Modelle sind immer sehr detailgetreu.",1,"Z. 9–10: von sehr abstrakt bzw. stark vereinfacht bis sehr detailgetreu."],
    ["Modelle helfen, komplexe Phänomene zu verstehen.",0,"Z. 11–12: Sie dienen der Veranschaulichung."],
    ["Modelle braucht man nur in der Schule.",1,"Z. 12–13: Sie sind Grundlage und Ergebnis von Forschung."],
    ["Mit Modellen kann man Abläufe beobachten, analysieren und strukturieren.",0,"Z. 13–14."]
  ]}],
  solution:"<b>Das ergänzt du (Beispiele):</b><ul><li>grafische oder symbolische Darstellung (Z. 6)</li><li>statische oder dynamische Phänomene (Z. 6–8)</li><li>von sehr abstrakt bis sehr detailgetreu (Z. 9–10)</li><li>Grundlage und Ergebnis von Forschung (Z. 12–13)</li><li>„Theorie“ und „Modell“ oft synonym (Z. 4)</li></ul>"},
{ id:"herz", nr:5, title:"Herz-Labor", sub:"Aufgabe 4 · Abb. 1 und Abb. 2",
  sheet:"Schau dir <b>Abb. 1 und Abb. 2</b> auf Seite 2 an (Z. 15–20). Kreuze danach in der Tabelle zu Aufgabe 4 an und schreibe auf, was man damit verstehen kann.",
  tasks:[
    {type:"binary", opts:["statisch","dynamisch"], stem:"Zum Einstieg (Z. 15–17):", items:[

    {type:"binary", opts:["naturgetreu","abstrakt"], stem:"Wie ist die Darstellung?", items:[
      ["Abb. 1",0,"Abb. 1 zeigt das Herz so, wie es echt aussieht."],
      ["Abb. 2",1,"Abb. 2 ist stark vereinfacht und zeigt nur das Prinzip."]
    ]},
    {type:"binary", opts:["statisch","dynamisch"], stem:"Was zeigt sie?", items:[
      ["Abb. 1",0,"Abb. 1 zeigt den Aufbau – etwas Unbewegtes."],
      ["Abb. 2",1,"Abb. 2 zeigt einen Ablauf: wie das Blut fließt."]
    ]},
    {type:"single", stem:"Was kann man mit Abb. 1 verstehen?", items:[[
      ["den Aufbau des Herzens: Form, Vorhöfe, Kammern, große Gefäße, Herzkranzgefäße","wie schnell das Herz in Ruhe schlägt","wie das Blut in Füllungs- und Auswurfphase durch das Herz fließt"],0,"Z. 18: Modelle helfen, den Aufbau nachzuvollziehen (Abb. 1)."]]},
    {type:"single", stem:"Was kann man mit Abb. 2 verstehen?", items:[[
      ["wie das Herz von außen genau aussieht","wie das Blut in Füllungsphase (Diastole) und Auswurfphase (Systole) fließt und wie die Herzklappen arbeiten","wo die Herzkranzgefäße liegen"],1,"Z. 18–19: Modelle helfen, die Funktionsweise zu erfassen (Abb. 2)."]]}
  ]},
{ id:"sichtweise", nr:6, title:"Zeitreise der Modelle", sub:"Aufgabe 5 · Reihenfolge und Sichtweise",
  sheet:"Trage zu Aufgabe 5a die vier Modelle in der richtigen Reihenfolge ein (Z. 25–28). Lies den Kasten „Erinnere dich!“ auf Seite 5 und schreibe zu 5b eine eigene Erklärung.",
  tasks:[
    {type:"order", stem:"Tippe die vier Modelle in der Reihenfolge an, in der sie im Text vorgestellt werden (Z. 25–28):",
      items:["das biomedizinische Krankheitsmodell","das Risikofaktorenmodell","das Modell der Salutogenese","das Anforderungs-Ressourcen-Modell"],
      explain:"Z. 25–28: biomedizinisches Krankheitsmodell → Risikofaktorenmodell → Salutogenese → Anforderungs-Ressourcen-Modell (zeitlich geordnet)."},
    {type:"binary", stem:"Pathogenetisch (Krankheit) oder salutogenetisch (Gesundheit)?", opts:["pathogenetisch","salutogenetisch"], items:[
      ["„Was macht den Menschen krank?“",0,"Pathogenese = Entstehung von Krankheit."],
      ["„Was hält den Menschen gesund?“",1,"Salutogenese = Entstehung von Gesundheit."],
      ["das biomedizinische Krankheitsmodell",0,"Ein frühes Modell mit Blick auf Krankheit."],
      ["das Risikofaktorenmodell",0,"Es fragt, was Krankheit begünstigt."],
      ["das Anforderungs-Ressourcen-Modell",1,"Ein späteres Modell mit Blick auf Gesundheit."],
      ["Krankheit erkennen, behandeln oder verhindern",0,"Der Blick liegt auf der Krankheit."],
      ["Gesundheit stärken",1,"Der Blick liegt auf der Gesundheit."]
    ]},
    {type:"single", stem:"Was bedeutet „von der pathogenetischen zur salutogenetischen Sichtweise“ (Z. 29–30)?", items:[[

{ id:"merke", nr:7, title:"Merkkasten", sub:"Aufgabe 6 · Lückentext",

{ id:"sprinter", nr:8, title:"Sprinter: Modell-Scanner", sub:"Sprinteraufgabe · weitere Modelle",

  tasks:[

  let t=ac.currentTime; seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);t+=d;});}catch(e){} }

function noteOk(v){v=(v||"").trim();const w=v.split(/\s+/).filter(x=>/[a-zäöüß]{2,}/i.test(x));return v.length>=30&&w.length>=6&&new Set(w.map(x=>x.toLowerCase())).size>=4;}
function noteHint(v){v=(v||"").trim();const n=v.split(/\s+/).filter(x=>/[a-zäöüß]{2,}/i.test(x)).length;return noteOk(v)?"✓ Danke, eure Vermutung ist eingetragen.":"Pflichtfeld: Schreibe eure Vermutung in ganzen Sätzen (mindestens 6 Wörter). Bisher: "+n+" Wörter.";}
/* ---------- Eine Welt spielen ---------- */
function buildQueue(L){
  const q=[];
  L.tasks.forEach(t=>{
    if(t.type==="note") q.push({kind:"note",t});
    else if(t.type==="binary") shuffle(t.items).forEach(([s,a,e])=>q.push({kind:"choice",label:t.stem||"",prompt:s,opts:t.opts,correct:a,explain:e,two:true}));
    else if(t.type==="single") t.items.forEach(([opts,a,e,st])=>{const idx=shuffle(opts.map((o,k)=>k));q.push({kind:"choice",label:"",prompt:st||t.stem,opts:idx.map(k=>opts[k]),correct:idx.indexOf(a),explain:e});});
    else if(t.type==="order") q.push({kind:"order",t});
    else if(t.type==="self") q.push({kind:"self",t});
    else if(t.type==="gaps") q.push({kind:"gaps"});
  });
  return q;
}

  const mult=()=>run.combo>=6?3:run.combo>=3?2:1;
  function hud(){hz.innerHTML=hearts(run.hearts);const m=mult();cb.textContent="KOMBO x"+m;cb.classList.toggle("hot",m>1);pt.innerHTML='<span class="coin"></span>'+run.points;

  function gain(n){run.points+=n;floatTxt("+"+n);beep("ok");}
  function lose(){if(run.hearts>0){run.hearts--;floatTxt("−1 ♥",true);}run.combo=0;beep("bad");}

      if(c.label) box.appendChild(el("span","label",esc(c.label.toUpperCase())));
      if(c.retry) box.appendChild(el("span","label",'<span style="color:var(--coin)">2. VERSUCH · '+RETRY+' MÜNZEN</span>'));
      box.appendChild(el("p","prompt",esc(c.prompt)));
      const o=el("div","opts"+(c.two&&c.opts.every(x=>x.length<22)?" two":"")); const bs=[];
      c.opts.forEach((txt,k)=>{const b=el("button","opt",esc(txt));b.type="button";bs.push(b);o.appendChild(b);
        b.onclick=()=>{bs.forEach(x=>x.disabled=true);const ok=k===c.correct;
          const fb=el("div","feedback "+(ok?"good":"bad"));
          if(ok){b.classList.add("right");let n;if(c.retry){n=RETRY;}else{run.combo++;n=BASE*mult();}gain(n);fb.innerHTML=(c.retry?"Jetzt stimmt’s!":["Richtig!","Treffer!","Stark!","Genau!"][Math.floor(Math.random()*4)])+'<span class="why">'+esc(c.explain||"")+'</span>';}
          else{b.classList.add("wrong");bs[c.correct].classList.add("right");if(!c.retry){lose();run.q.push(Object.assign({},c,{retry:true,opts:c.opts}));fb.innerHTML='Leider falsch. Richtig ist: „'+esc(c.opts[c.correct])+'“<span class="why">'+esc(c.explain||"")+' Die Frage kommt am Ende noch einmal.</span>';}
            else{fb.innerHTML='Wieder falsch. Richtig ist: „'+esc(c.opts[c.correct])+'“<span class="why">'+esc(c.explain||"")+' Verbessere das auf deinem Arbeitsblatt.</span>';beep("bad");}}
          hud();box.appendChild(fb);nextBtn(box);};});
      box.appendChild(o);
    } else if(c.kind==="note"){
      box.appendChild(el("label","prompt",esc(c.t.label))).setAttribute("for","note");
      const ta=el("textarea");ta.id="note";ta.placeholder=c.t.ph;ta.value=S.note||"";box.appendChild(ta);const hint=el("p","foot");hint.style.textAlign="left";box.appendChild(hint);
      const nb=el("button","btn","Weiter ▶");nb.type="button";nb.onclick=()=>{if(noteOk(ta.value))next();};box.appendChild(nb);
      const upd=()=>{const ok=noteOk(ta.value);nb.disabled=!ok;hint.textContent=noteHint(ta.value);hint.style.color=ok?"var(--lime)":"var(--dim)";};
      ta.oninput=()=>{S.note=ta.value;save();upd();};upd();
    } else if(c.kind==="self"){
      box.appendChild(el("span","label","SELBST-CHECK · "+RETRY+" MÜNZEN JE HAKEN"));
      if(c.t.intro) box.appendChild(el("div","tip",c.t.intro));
      box.appendChild(el("p","prompt",esc(c.t.stem)));
      if(L.solution&&L.id==="vermutung") box.appendChild(el("div","tip",L.solution));
      const cbs=c.t.items.map((s,k)=>{const lab=el("label","check",'<input type="checkbox" id="self'+k+'"><span>'+esc(s)+'</span>');box.appendChild(lab);return lab.querySelector("input");});
      const b=el("button","btn","Fertig ▶");b.type="button";b.onclick=()=>{const n=cbs.filter(x=>x.checked).length*RETRY;cbs.forEach(x=>x.disabled=true);if(n)gain(n);next();};box.appendChild(b);
    } else if(c.kind==="order"){
      const t=c.t; box.appendChild(el("span","label","SORTIER-RÄTSEL · "+2*BASE+" MÜNZEN × KOMBO"));
      box.appendChild(el("p","prompt",esc(t.stem)));
      const slots=el("div","slots"),pool=el("div","opts");let seq=[];
      const draw=()=>{slots.innerHTML="";for(let k=0;k<t.items.length;k++)slots.appendChild(el("div","slot"+(seq[k]!=null?" filled":""),seq[k]!=null?esc(t.items[seq[k]]):'<span style="color:var(--dim)">…</span>'));pool.querySelectorAll(".opt").forEach(b=>b.hidden=seq.includes(+b.dataset.i));chk.disabled=seq.length<t.items.length;};
      shuffle(t.items.map((s,k)=>k)).forEach(k=>{const b=el("button","opt",esc(t.items[k]));b.type="button";b.dataset.i=k;b.onclick=()=>{beep("tap");seq.push(k);draw();};pool.appendChild(b);});
      const ctr=el("div","btns");const undo=el("button","btn ghost","Rückgängig");undo.type="button";undo.onclick=()=>{seq.pop();draw();};
      const chk=el("button","btn","Prüfen");chk.type="button";
      chk.onclick=()=>{ctr.remove();pool.remove();const ok=seq.every((x,k)=>x===k);
        [...slots.children].forEach((s,k)=>s.classList.add(seq[k]===k?"ok":"no"));
        const fb=el("div","feedback "+(ok?"good":"bad"));
        if(ok){run.combo++;gain(2*BASE*mult());fb.innerHTML='Perfekt sortiert!<span class="why">'+esc(t.explain)+'</span>';}
        else{lose();seq=t.items.map((s,k)=>k);draw();[...slots.children].forEach(s=>s.classList.add("ok"));fb.innerHTML='Nicht ganz. Oben siehst du jetzt die richtige Reihenfolge.<span class="why">'+esc(t.explain)+'</span>';}
        hud();box.appendChild(fb);nextBtn(box);};
      ctr.append(undo,chk);box.append(slots,pool,ctr);draw();
    } else if(c.kind==="gaps"){
      box.appendChild(el("span","label",'<span style="color:var(--heart)">BOSS-KAMPF · JEDE RUNDE MIT FEHLERN KOSTET EIN HERZ</span>'));
      const bank=el("div","bank");BANK.forEach(x=>{const s=el("span","",esc(x));s.dataset.w=x;bank.appendChild(s);});
      box.appendChild(el("p","","<b>Wortspeicher</b>"));box.appendChild(bank);
      const m=el("div","merke",'<p class="prompt">Merke: Modelle von Gesundheit und Krankheit</p>');const ul=el("ul");const sels=[];let gi=0;
      const ref=()=>{const u=sels.map(g=>g.sel.value);bank.querySelectorAll("span").forEach(s=>s.classList.toggle("used",u.includes(s.dataset.w)));};
      GAPS.forEach(parts=>{const li=el("li");parts.forEach((p,k)=>{if(k%2===0){li.appendChild(document.createTextNode(p));return;}
        const sel=document.createElement("select");sel.className="gap";sel.id="gap"+(gi++);sel.setAttribute("aria-label","Lücke");
        sel.innerHTML='<option value="">– wählen –</option>'+BANK.map(x=>'<option>'+esc(x)+'</option>').join("");sel.onchange=ref;
        const sol=el("span","gapsol");sol.hidden=true;li.append(sel,sol);sels.push({sel,ans:p,sol});});ul.appendChild(li);});
      m.appendChild(ul);box.appendChild(m);
      const isOk=(g,k)=>{if(g.ans==="statisch"||g.ans==="dynamisch"){const o=sels[g.ans==="statisch"?k+1:k-1].sel.value;return ["statisch","dynamisch"].includes(g.sel.value)&&g.sel.value!==o;}return g.sel.value===g.ans;};
      let round=1;const got=new Set();const msg=el("div");box.appendChild(msg);
      const chk=el("button","btn red","Angriff! (Prüfen)");chk.type="button";box.appendChild(chk);
      chk.onclick=()=>{const open=sels.filter(g=>!g.sel.value).length;if(open){msg.className="feedback bad";msg.textContent="Es fehlen noch "+open+" Lücken.";return;}
        let n=0;sels.forEach((g,k)=>{if(got.has(k))return;const ok=isOk(g,k);g.sel.classList.remove("ok","bad");g.sel.classList.add(ok?"ok":"bad");if(ok){got.add(k);n+=round===1?BASE:RETRY;g.sel.disabled=true;}});
        if(n)gain(n);const wrong=sels.length-got.size;
        if(wrong&&round===1){lose();round=2;hud();msg.className="feedback bad";msg.textContent="Der Boss hat noch "+wrong+" Lebenspunkte! Verbessere die roten Lücken.";chk.textContent="Letzter Angriff!";return;}
        if(wrong){lose();sels.forEach((g,k)=>{if(!got.has(k)){g.sol.hidden=false;g.sol.textContent="→ "+g.ans;}});}
        sels.forEach(g=>g.sel.disabled=true);chk.remove();hud();
        msg.className="feedback good";msg.innerHTML=wrong?'Boss besiegt – knapp!<span class="why">Die grünen Wörter hinter den roten Lücken sind die Lösung. Übertrage den Merkkasten richtig auf dein Arbeitsblatt.</span>':'Boss besiegt – fehlerfrei!<span class="why">Übertrage den Merkkasten jetzt auf dein Arbeitsblatt.</span>';
        nextBtn(box);};
    }
    stage.appendChild(box);
  }
  function win(){
    stage.innerHTML="";const stars=run.hearts>=4?3:run.hearts>=2?2:1;const prev=S.done[L.id];
    if(!prev||run.points>prev.points)S.done[L.id]={points:run.points,stars:Math.max(stars,prev?prev.stars:0)};
    else if(stars>prev.stars)S.done[L.id].stars=stars;
    save();bump();beep("win");
    const box=el("div","box stack win");
    box.innerHTML='<span class="label">WELT '+L.nr+' GESCHAFFT</span><div class="bigstars">'+[0,1,2].map(k=>STAR(k<stars)).join("")+'</div><div class="score-big">'+run.points+'</div><p>Münzen in dieser Welt'+(prev&&run.points<=prev.points?'<br><span class="foot">Dein Rekord ('+prev.points+') bleibt gespeichert.</span>':'')+'</p>'+(L.solution&&L.id!=="vermutung"?'<div class="tip" style="text-align:left">'+L.solution+'</div>':'');
    const bs=el("div","btns");bs.style.justifyContent="center";
    if(i+1<LEVELS.length){const n=el("button","btn","Nächste Welt ▶");n.type="button";n.onclick=()=>play(i+1);bs.appendChild(n);}
    else{const f=el("button","btn red","Highscore ▶");f.type="button";f.onclick=finale;bs.appendChild(f);}
    const a=el("button","btn ghost","Nochmal");a.type="button";a.onclick=()=>play(i);const k=el("button","btn ghost","Karte");k.type="button";k.onclick=home;bs.append(a,k);
    box.appendChild(bs);stage.appendChild(box);hud();bar.firstChild.style.width="100%";
  }
  show(run.q[0]);
}
function readGate(i){
  const L=LEVELS[i];const w=el("div","stack");
  const back=el("button","btn ghost","‹ Karte");back.type="button";back.onclick=home;back.style.alignSelf="flex-start";w.appendChild(back);
  w.appendChild(el("div","stack",'<span class="label">WELT '+L.nr+' · LADE-STATION</span><h2>'+esc(L.title)+'</h2>')).style.gap="6px";
  const box=el("div","box stack");
  box.appendChild(el("p","prompt","Lade deine Energie auf: Lies jetzt den Fachtext."));
  box.appendChild(el("div","tip",L.sheet));
  const a=el("label","check",'<input type="checkbox" id="r1"><span>Ich habe den Text zweimal gelesen.</span>');
  const b=el("label","check",'<input type="checkbox" id="r2"><span>Ich habe wichtige Punkte unterstrichen und unbekannte Wörter nachgeschaut.</span>');
  const go=el("button","btn","Energie voll ▶");go.type="button";go.disabled=true;
  const u=()=>{go.disabled=!(a.querySelector("input").checked&&b.querySelector("input").checked);};
  a.querySelector("input").onchange=u;b.querySelector("input").onchange=u;
  go.onclick=()=>{S.done[L.id]={points:0,stars:3};save();beep("win");play(i+1);};
  box.append(a,b,go);w.appendChild(box);app.appendChild(w);
}
function finale(){
  window.scrollTo(0,0);app.innerHTML="";bump();
  const rows=LEVELS.filter(L=>!L.read).map(L=>{const d=S.done[L.id]||{points:0,stars:0};return '<tr><td>'+esc(L.title)+'</td><td>'+smallStars(d.stars)+'</td><td class="n">'+d.points+'</td></tr>';}).join("");
  const sum=LEVELS.reduce((a,L)=>a+((S.done[L.id]||{}).stars||0)*(L.read?0:1),0);
  const now=new Date();const ts=now.toLocaleDateString("de-DE")+", "+now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  const w=el("div","stack");
  w.appendChild(el("div","box stack win",'<span class="label">HIGHSCORE</span><h1>Quest geschafft!</h1><div class="score-big">'+total()+'</div><p>Münzen · '+sum+' von '+3*LEVELS.filter(L=>!L.read).length+' Sternen</p><p class="px" style="font-size:.7rem;color:var(--lime)">'+esc(rank())+'</p><div style="overflow-x:auto;max-width:100%"><table class="hs">'+rows+'</table></div><p class="foot">Stand: '+esc(ts)+'</p>'));
  w.appendChild(el("div","tip","<b>Letzter Schritt:</b> Mache einen Screenshot von dieser Übersicht und sende ihn an Herrn Heuermann (Teams). Hast du alles auf deinem Arbeitsblatt verbessert?"));
  const b=el("button","btn ghost","‹ Zur Karte");b.type="button";b.onclick=home;w.appendChild(b);
  app.appendChild(w);beep("win");
}
home();
})();
</script>

</body></html>
